<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="dashboard-token" content="__DASHBOARD_TOKEN__" />
    <title>Verbatim Automation</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body data-density="compact" data-theme="dark">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Verbatim</span>
        <span class="brand-sub">Automation</span>
      </div>
      <div class="topbar-prs" id="topPrCounts" aria-label="Pull request summary"></div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <span class="mode-badge" id="modeBadge">Local read-only</span>
        <div class="seg" role="group" aria-label="Density">
          <button id="densityCompact" class="seg-btn is-on" type="button">Compact</button>
          <button id="densityCozy" class="seg-btn" type="button">Cozy</button>
        </div>
        <button id="refreshBtn" class="btn" type="button" title="Refresh (R)">Refresh</button>
        <button id="historyBtn" class="btn" type="button" title="Browse closed issues & all PRs (H)">History</button>
        <button id="helpBtn" class="btn btn-icon" type="button" aria-label="Keyboard shortcuts" title="Shortcuts (?)">?</button>
      </div>
    </header>

    <div id="errorBanner" class="error-banner hidden" role="alert"></div>

    <main class="workspace">
      <aside class="rail rail-left" aria-label="Issues">
        <div class="rail-head">
          <span class="rail-title">Issues <span id="issueCount" class="rail-count"></span></span>
          <button id="collapseLeft" class="btn btn-mini" type="button" aria-expanded="true" title="Collapse issues ([)">Hide</button>
        </div>
        <div class="filters" id="issueFilters" role="tablist" aria-label="Issue filters"></div>
        <div class="rail-scroll" id="issueList" role="listbox" aria-label="Issues" tabindex="0"></div>
      </aside>

      <section class="center" aria-label="Issue detail">
        <div id="issueDetail" class="center-scroll"></div>
      </section>

      <aside class="rail rail-right" id="rightRail" aria-label="Context">
        <div class="rail-head">
          <span class="rail-title">Context</span>
          <button id="collapseRight" class="btn btn-mini" type="button" aria-expanded="true">Hide</button>
        </div>
        <div class="rail-scroll" id="contextPanel"></div>
      </aside>
    </main>

    <button id="showLeft" class="show-left" type="button" aria-label="Show issues">Issues</button>
    <button id="showRight" class="show-right" type="button" aria-label="Show context">Context</button>

    <div id="helpPopover" class="help-popover hidden" role="dialog" aria-label="Keyboard shortcuts">
      <div class="help-title">Keyboard shortcuts</div>
      <ul class="help-list">
        <li><kbd>↑</kbd><kbd>↓</kbd> switch issue</li>
        <li><kbd>←</kbd><kbd>→</kbd> switch phase</li>
        <li><kbd>R</kbd> refresh</li>
        <li><kbd>/</kbd> focus filter</li>
        <li><kbd>S</kbd> scan all phases</li>
        <li><kbd>[</kbd><kbd>]</kbd> collapse issues / context</li>
        <li><kbd>H</kbd> history (closed issues / PRs)</li>
        <li><kbd>Esc</kbd> close</li>
      </ul>
    </div>

    <div id="historyOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="History">
      <div class="overlay-backdrop" id="historyBackdrop"></div>
      <div class="overlay-panel">
        <div class="overlay-head">
          <div class="overlay-tabs" role="tablist" aria-label="History">
            <button class="otab is-on" data-tab="issues" type="button" role="tab">Closed issues <span class="otab-n" id="histIssueN"></span></button>
            <button class="otab" data-tab="prs" type="button" role="tab">Pull requests <span class="otab-n" id="histPrN"></span></button>
          </div>
          <button id="historyClose" class="btn btn-mini" type="button">Close</button>
        </div>
        <div class="overlay-filters" id="historyFilters"></div>
        <div class="overlay-body" id="historyBody"></div>
      </div>
    </div>

    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
