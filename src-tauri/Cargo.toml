[package]
name = "superwisper"
version = "0.1.0"
description = "SuperWisper \u2014 voice transcription for Windows"
authors = ["SuperWisper contributors"]
edition = "2021"

[lib]
name = "superwisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

