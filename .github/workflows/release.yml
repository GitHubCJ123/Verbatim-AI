name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Single source of truth for whisper.cpp version used by every release.
# Bump this when upgrading the bundled whisper runtime.
env:
  WHISPER_CPP_VERSION: v1.8.4

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Stable shared key so bumping verbatim-ai's version (which
          # touches Cargo.lock) doesn't invalidate the whole cache. When
          # the lockfile changes we still get a restore-key match against
          # the previous build, so only changed deps recompile.
          shared-key: release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # --- Whisper runtime zips, bundled into installers and attached to the release ---

      - name: (Windows) Fetch whisper.cpp CPU build
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/${{ env.WHISPER_CPP_VERSION }}/whisper-bin-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile whisper-bin-windows-x64-cpu-upstream.zip
          # The Verbatim runtime archive must contain both entrypoints:
          # one-shot whisper-cli and warm-model whisper-server. The upstream
          # whisper.cpp binary bundle is already built; reassemble it so CI
          # fails loudly if either executable disappears in a future release.
          $stage = "whisper-cpu-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Expand-Archive -Path whisper-bin-windows-x64-cpu-upstream.zip -DestinationPath $stage -Force
          $cli = Get-ChildItem $stage -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) {
            throw "whisper-cli.exe missing from CPU runtime archive"
          }
          if (-not (Get-ChildItem $stage -Recurse -Filter whisper-server.exe | Select-Object -First 1)) {
            Write-Warning "whisper-server.exe missing from CPU runtime archive; warm-server engine unavailable this release (app falls back to whisper-cli)"
          }

          function Invoke-WhisperStreamBuild {
            param(
              [string]$Variant,
              [string]$WhisperRoot,
              [string]$BuildDir,
              [string]$DestinationDir
            )
            if (-not (Test-Path "sidecars/whisper-stream/CMakeLists.txt")) {
              Write-Warning "whisper-stream source missing for $Variant; true streaming unavailable this release (app falls back)"
              return
            }
            try {
              Remove-Item -Recurse -Force $BuildDir -ErrorAction SilentlyContinue
              cmake -S sidecars/whisper-stream -B $BuildDir -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DWHISPER_ROOT="$WhisperRoot"
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream configure returned $LASTEXITCODE" }
              cmake --build $BuildDir --config Release --target whisper-stream --parallel
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream build returned $LASTEXITCODE" }
              $stream = Get-ChildItem $BuildDir -Recurse -Filter whisper-stream.exe | Select-Object -First 1
              if (-not $stream) { throw "whisper-stream.exe missing after build" }
              Copy-Item $stream.FullName (Join-Path $DestinationDir "whisper-stream.exe") -Force
            } catch {
              Write-Warning "whisper-stream not bundled for $Variant; true streaming unavailable this release (app falls back): $($_.Exception.Message)"
            }
            # The sidecar is optional (the app falls back to chunked streaming).
            # A failed build must NOT fail the release step, so clear any leaked
            # native exit code before the surrounding step continues.
            $global:LASTEXITCODE = 0
          }

          # Upstream CPU ZIPs have no separate CMake build tree, so use the
          # expanded directory containing whisper-cli.exe as WHISPER_ROOT.
          Invoke-WhisperStreamBuild `
            -Variant "Windows CPU" `
            -WhisperRoot $cli.DirectoryName `
            -BuildDir "sidecars/whisper-stream/build-windows-cpu" `
            -DestinationDir $cli.DirectoryName
          Compress-Archive -Path "$stage/*" -DestinationPath whisper-bin-windows-x64-cpu.zip -Force

      - name: (Windows) Fetch whisper.cpp CUDA build
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/${{ env.WHISPER_CPP_VERSION }}/whisper-cublas-12.4.0-bin-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile whisper-bin-windows-x64-cuda-upstream.zip
          # Keep the CUDA archive layout aligned with CPU/Vulkan: both
          # whisper-cli.exe and whisper-server.exe ship in one runtime zip.
          $stage = "whisper-cuda-stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Expand-Archive -Path whisper-bin-windows-x64-cuda-upstream.zip -DestinationPath $stage -Force
          $cli = Get-ChildItem $stage -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) {
            throw "whisper-cli.exe missing from CUDA runtime archive"
          }
          if (-not (Get-ChildItem $stage -Recurse -Filter whisper-server.exe | Select-Object -First 1)) {
            Write-Warning "whisper-server.exe missing from CUDA runtime archive; warm-server engine unavailable this release (app falls back to whisper-cli)"
          }

          function Invoke-WhisperStreamBuild {
            param(
              [string]$Variant,
              [string]$WhisperRoot,
              [string]$BuildDir,
              [string]$DestinationDir
            )
            if (-not (Test-Path "sidecars/whisper-stream/CMakeLists.txt")) {
              Write-Warning "whisper-stream source missing for $Variant; true streaming unavailable this release (app falls back)"
              return
            }
            try {
              Remove-Item -Recurse -Force $BuildDir -ErrorAction SilentlyContinue
              cmake -S sidecars/whisper-stream -B $BuildDir -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DWHISPER_ROOT="$WhisperRoot"
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream configure returned $LASTEXITCODE" }
              cmake --build $BuildDir --config Release --target whisper-stream --parallel
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream build returned $LASTEXITCODE" }
              $stream = Get-ChildItem $BuildDir -Recurse -Filter whisper-stream.exe | Select-Object -First 1
              if (-not $stream) { throw "whisper-stream.exe missing after build" }
              Copy-Item $stream.FullName (Join-Path $DestinationDir "whisper-stream.exe") -Force
            } catch {
              Write-Warning "whisper-stream not bundled for $Variant; true streaming unavailable this release (app falls back): $($_.Exception.Message)"
            }
            # The sidecar is optional (the app falls back to chunked streaming).
            # A failed build must NOT fail the release step, so clear any leaked
            # native exit code before the surrounding step continues.
            $global:LASTEXITCODE = 0
          }

          # Upstream CUDA ZIPs have no separate CMake build tree, so use the
          # expanded directory containing whisper-cli.exe as WHISPER_ROOT.
          Invoke-WhisperStreamBuild `
            -Variant "Windows CUDA" `
            -WhisperRoot $cli.DirectoryName `
            -BuildDir "sidecars/whisper-stream/build-windows-cuda" `
            -DestinationDir $cli.DirectoryName
          Compress-Archive -Path "$stage/*" -DestinationPath whisper-bin-windows-x64-cuda.zip -Force

      - name: (Windows) Build whisper.cpp Vulkan build
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vkVersion = "1.3.290.0"
          $vkInstaller = "VulkanSDK-$vkVersion-Installer.exe"
          $vkUrl = "https://sdk.lunarg.com/sdk/download/$vkVersion/windows/$vkInstaller"
          $vkSha256 = "0ba0392a78157b82354157c5c988d74ddc6bc15573cc9c8653aa60245355fe8a"
          Invoke-WebRequest $vkUrl -OutFile $vkInstaller
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $vkInstaller).Hash.ToLower()
          if ($actualSha256 -ne $vkSha256) {
            throw "Vulkan SDK installer SHA256 mismatch: expected $vkSha256, got $actualSha256"
          }
          Start-Process -FilePath ".\$vkInstaller" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow
          $env:VULKAN_SDK = "C:\VulkanSDK\$vkVersion"
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"

          git clone --depth 1 --branch "${{ env.WHISPER_CPP_VERSION }}" https://github.com/ggml-org/whisper.cpp.git whisper-vulkan
          cmake -S whisper-vulkan -B whisper-vulkan/build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_BACKEND_DL=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-vulkan/build --config Release --parallel

          New-Item -ItemType Directory -Force whisper-vulkan-stage | Out-Null
          Copy-Item whisper-vulkan/build/bin/Release/* whisper-vulkan-stage/ -Recurse -Force
          if (-not (Test-Path whisper-vulkan-stage/whisper-cli.exe)) {
            throw "whisper-cli.exe missing from Vulkan runtime build"
          }
          if (-not (Test-Path whisper-vulkan-stage/whisper-server.exe)) {
            Write-Warning "whisper-server.exe missing from Vulkan runtime build; warm-server engine unavailable this release (app falls back to whisper-cli)"
          }

          function Invoke-WhisperStreamBuild {
            param(
              [string]$Variant,
              [string]$WhisperRoot,
              [string]$BuildDir,
              [string]$DestinationDir
            )
            if (-not (Test-Path "sidecars/whisper-stream/CMakeLists.txt")) {
              Write-Warning "whisper-stream source missing for $Variant; true streaming unavailable this release (app falls back)"
              return
            }
            try {
              Remove-Item -Recurse -Force $BuildDir -ErrorAction SilentlyContinue
              cmake -S sidecars/whisper-stream -B $BuildDir -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DWHISPER_ROOT="$WhisperRoot"
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream configure returned $LASTEXITCODE" }
              cmake --build $BuildDir --config Release --target whisper-stream --parallel
              if ($LASTEXITCODE -ne 0) { throw "whisper-stream build returned $LASTEXITCODE" }
              $stream = Get-ChildItem $BuildDir -Recurse -Filter whisper-stream.exe | Select-Object -First 1
              if (-not $stream) { throw "whisper-stream.exe missing after build" }
              Copy-Item $stream.FullName (Join-Path $DestinationDir "whisper-stream.exe") -Force
            } catch {
              Write-Warning "whisper-stream not bundled for $Variant; true streaming unavailable this release (app falls back): $($_.Exception.Message)"
            }
            # The sidecar is optional (the app falls back to chunked streaming).
            # A failed build must NOT fail the release step, so clear any leaked
            # native exit code before the surrounding step continues.
            $global:LASTEXITCODE = 0
          }

          Invoke-WhisperStreamBuild `
            -Variant "Windows Vulkan" `
            -WhisperRoot "whisper-vulkan/build" `
            -BuildDir "sidecars/whisper-stream/build-windows-vulkan" `
            -DestinationDir "whisper-vulkan-stage"
          Compress-Archive -Path whisper-vulkan-stage/* -DestinationPath whisper-bin-windows-x64-vulkan.zip -Force

      - name: (macOS) Build whisper.cpp with Metal
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.WHISPER_CPP_VERSION }}" \
            https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j$(sysctl -n hw.ncpu)

          # Stage into a dedicated dir name that can't collide with Vite's
          # `dist/` output in the repo root.
          STAGE=whisper-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          build_stream_sidecar() {
            local variant="$1"
            local whisper_root="$2"
            local build_dir="$3"
            local destination_dir="$4"
            if [ ! -f sidecars/whisper-stream/CMakeLists.txt ]; then
              echo "::warning::whisper-stream source missing for ${variant}; true streaming unavailable this release (app falls back)"
              return 0
            fi
            rm -rf "$build_dir"
            if cmake -S sidecars/whisper-stream -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DWHISPER_ROOT="$whisper_root" \
              && cmake --build "$build_dir" --config Release --target whisper-stream -j$(sysctl -n hw.ncpu); then
              stream_bin=$(find "$build_dir" -type f -name "whisper-stream" | head -n 1 || true)
              if [ -n "$stream_bin" ]; then
                cp "$stream_bin" "$destination_dir/"
                chmod +x "$destination_dir/whisper-stream"
              else
                echo "::warning::whisper-stream binary missing for ${variant}; true streaming unavailable this release (app falls back)"
              fi
            else
              echo "::warning::whisper-stream not bundled for ${variant}; true streaming unavailable this release (app falls back)"
            fi
          }

          cp whisper.cpp/build/bin/whisper-cli "$STAGE/"
          cp whisper.cpp/build/bin/whisper-server "$STAGE/" 2>/dev/null || echo "::warning::whisper-server not built; warm-server engine unavailable this release (app falls back to whisper-cli)"
          build_stream_sidecar "macOS arm64 Metal" "whisper.cpp" "sidecars/whisper-stream/build-macos-metal" "$STAGE"
          find whisper.cpp/build -type f -name "*.dylib" -exec cp -n {} "$STAGE/" \;

          cd "$STAGE"
          chmod +x whisper-cli
          [ -f whisper-server ] && chmod +x whisper-server
          [ -f whisper-stream ] && chmod +x whisper-stream

          # Set every dylib's install_name to point at its sibling next to
          # the executable. This is the id _other_ binaries will see.
          for dylib in *.dylib; do
            install_name_tool -id "@executable_path/$dylib" "$dylib" || true
          done

          # Rewrite every @rpath/<dep> reference in whisper-cli,
          # optional whisper-server/whisper-stream, and each
          # dylib so it points at @executable_path/<actual file>.
          # Dependencies are named like @rpath/libwhisper.1.dylib but the
          # real files have full versions like libwhisper.1.8.4.dylib —
          # match by `<prefix>.<major>.dylib` against `<prefix>.<major>.*.dylib`.
          rewrite_deps() {
            local bin="$1"
            otool -L "$bin" | awk 'NR>1 {print $1}' | while read -r dep; do
              case "$dep" in
                @rpath/*)
                  local key="${dep#@rpath/}"            # libwhisper.1.dylib
                  local prefix="${key%.dylib}"          # libwhisper.1
                  local target=""
                  for candidate in ${prefix}.*.dylib; do
                    if [ -f "$candidate" ]; then
                      target="$candidate"
                      break
                    fi
                  done
                  if [ -n "$target" ]; then
                    install_name_tool -change "$dep" "@executable_path/$target" "$bin" || true
                  fi
                  ;;
              esac
            done
          }

          rewrite_bins="whisper-cli"
          [ -f whisper-server ] && rewrite_bins="$rewrite_bins whisper-server"
          [ -f whisper-stream ] && rewrite_bins="$rewrite_bins whisper-stream"
          for bin in $rewrite_bins *.dylib; do
            rewrite_deps "$bin"
          done

          echo "--- staged contents ---"
          ls -lh
          echo "--- whisper-cli deps after rewriting ---"
          otool -L whisper-cli
          if [ -f whisper-server ]; then
            echo "--- whisper-server deps after rewriting ---"
            otool -L whisper-server
          fi
          if [ -f whisper-stream ]; then
            echo "--- whisper-stream deps after rewriting ---"
            otool -L whisper-stream
          fi
          echo "--- libwhisper deps after rewriting ---"
          for d in libwhisper.*.dylib; do
            echo "## $d"
            otool -L "$d"
          done

          zip -r ../whisper-bin-macos-arm64.zip .
          cd ..
          echo "--- final archive ---"
          ls -lh whisper-bin-macos-arm64.zip


      - name: Build runtime manifest fragment
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # Build the per-platform runtime checksum fragment before packaging.
        # Runtime assets are uploaded after tauri-action creates the draft release.
        run: |
          files=()
          [ -f whisper-bin-windows-x64-cpu.zip ] && files+=("whisper-bin-windows-x64-cpu.zip")
          [ -f whisper-bin-windows-x64-vulkan.zip ] && files+=("whisper-bin-windows-x64-vulkan.zip")
          [ -f whisper-bin-windows-x64-cuda.zip ] && files+=("whisper-bin-windows-x64-cuda.zip")
          [ -f whisper-bin-macos-arm64.zip ] && files+=("whisper-bin-macos-arm64.zip")
          if [ ${#files[@]} -gt 0 ]; then
            mkdir -p _runtime
            python3 - "${files[@]}" > "_runtime/whisper-runtime-fragment-${RUNNER_OS}.json" <<'PY'
          import hashlib, json, pathlib, sys
          assets = {}
          for name in sys.argv[1:]:
              p = pathlib.Path(name)
              assets[p.name] = {
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "size": p.stat().st_size,
              }
          print(json.dumps({"assets": assets}, indent=2, sort_keys=True))
          PY
          else
            echo "No whisper runtime artifacts produced on this platform."
          fi

      - name: Build signed bundled runtime manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          files=()
          [ -f whisper-bin-windows-x64-cpu.zip ] && files+=("whisper-bin-windows-x64-cpu.zip")
          [ -f whisper-bin-windows-x64-vulkan.zip ] && files+=("whisper-bin-windows-x64-vulkan.zip")
          [ -f whisper-bin-windows-x64-cuda.zip ] && files+=("whisper-bin-windows-x64-cuda.zip")
          [ -f whisper-bin-macos-arm64.zip ] && files+=("whisper-bin-macos-arm64.zip")
          if [ ${#files[@]} -gt 0 ]; then
            python3 - "${files[@]}" > whisper-runtimes.json <<'PY'
          import hashlib, json, os, pathlib, sys
          assets = {}
          for name in sys.argv[1:]:
              p = pathlib.Path(name)
              assets[p.name] = {
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "size": p.stat().st_size,
              }
          print(json.dumps({"version": os.environ["VERSION"], "assets": assets}, indent=2, sort_keys=True))
          PY
            pnpm tauri signer sign whisper-runtimes.json > whisper-runtimes.json.sig
          fi

      - name: Stage bundled Whisper runtime resources
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/resources/whisper-runtimes
          mkdir -p src-tauri/resources/whisper-runtimes
          for f in whisper-bin-*.zip whisper-runtimes.json whisper-runtimes.json.sig; do
            [ -f "$f" ] && cp "$f" src-tauri/resources/whisper-runtimes/
          done
          find src-tauri/resources/whisper-runtimes -type f -maxdepth 1 -print

      - name: Build & release (installers)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Updater signing. If TAURI_SIGNING_PRIVATE_KEY is set,
          # tauri-action also produces `.sig` files next to each
          # bundle and a `latest.json` manifest the in-app updater
          # polls. Missing secrets = unsigned build, no auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Verbatim AI ${{ github.ref_name }}"
          releaseBody: |
            ## Installers
            Pick the file for your platform below.

            ## Local Whisper runtime
            The matching Local Whisper runtime is bundled into the installer and also attached to this release.

            ## Auto-update
            Existing installs on a previous version will detect this release in the background and offer one-click install.
          # Stays a draft during the build so assets upload incrementally; the
          # `Publish release (mark latest)` step at the end of publish-latest-json
          # flips it to published + latest once the full matrix + latest.json are
          # done. (Previously the draft had to be published by hand, which is why
          # "check for updates" saw the old version until someone published it.)
          releaseDraft: true
          prerelease: false
          # We *do* want the updater bundles (.nsis.zip / .app.tar.gz /
          # .sig). Without this flag tauri-action skips packaging them
          # entirely. tauri-action will then try to upload its own
          # latest.json and fail with a "signature not found" race;
          # that's harmless — our publish-latest-json job below
          # overwrites with a correctly-merged manifest.
          includeUpdaterJson: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Attach whisper runtime to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        # `gh release upload` targets the draft release that tauri-action
        # created for this tag and adds the runtime assets alongside the
        # installer. The same runtime assets are also bundled inside the
        # installer resources above, so Local Whisper works even while the
        # release is still draft/unpublished.
        run: |
          files=()
          [ -f whisper-bin-windows-x64-cpu.zip ] && files+=("whisper-bin-windows-x64-cpu.zip")
          [ -f whisper-bin-windows-x64-vulkan.zip ] && files+=("whisper-bin-windows-x64-vulkan.zip")
          [ -f whisper-bin-windows-x64-cuda.zip ] && files+=("whisper-bin-windows-x64-cuda.zip")
          [ -f whisper-bin-macos-arm64.zip ] && files+=("whisper-bin-macos-arm64.zip")
          [ -f whisper-runtimes.json ] && files+=("whisper-runtimes.json")
          [ -f whisper-runtimes.json.sig ] && files+=("whisper-runtimes.json.sig")
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            echo "No whisper runtime artifacts produced on this platform."
          fi

      - name: Upload runtime manifest fragment
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fragment-${{ matrix.platform }}
          path: _runtime/*.json
          if-no-files-found: warn
          retention-days: 1

      # tauri-action's auto-generated `latest.json` upload is racy: it
      # scans for `.sig` files before all bundles finish, then "skips
      # upload" even when signatures exist. We rebuild the manifest
      # from disk ourselves and upload it after each platform finishes,
      # then merge the platforms together below.
      - name: Generate platform updater manifest fragment
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p _updater

          echo "=== bundle dirs ==="
          find src-tauri/target -type d -name "bundle" 2>/dev/null || true
          echo "=== nsis contents (windows only) ==="
          ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || echo "(no nsis dir)"
          echo "=== macos contents (mac only) ==="
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/macos 2>/dev/null || echo "(no aarch64 dir)"
          ls -la src-tauri/target/release/bundle/macos 2>/dev/null || echo "(no host-arch macos dir)"

          if [ -d "src-tauri/target/release/bundle/nsis" ]; then
            # Windows: Tauri 2's updater downloads the `.exe` installer
            # directly when createUpdaterArtifacts is on; the `.sig` file
            # sits next to it as `<name>.exe.sig`.
            sig_file=$(find src-tauri/target/release/bundle/nsis -name "*.exe.sig" | head -n1 || true)
            exe_file=$(find src-tauri/target/release/bundle/nsis -name "*.exe" ! -name "*.sig" | head -n1 || true)
            if [ -n "$sig_file" ] && [ -n "$exe_file" ]; then
              sig=$(cat "$sig_file")
              fname=$(basename "$exe_file")
              # GitHub releases normalize asset filenames on upload:
              # spaces become periods. We need to match that exactly in
              # the manifest URL or the updater hits 404.
              fname_url=$(printf '%s' "$fname" | tr ' ' '.')
              # The setup.exe was already uploaded by tauri-action; we
              # just need to attach the .sig next to it so the URL has a
              # neighbor signature file.
              gh release upload "${VERSION}" "$sig_file" --clobber --repo "${{ github.repository }}"
              # Write BOTH the canonical and nsis-tagged keys so the
              # in-app updater finds whichever one it looks up first.
              cat > _updater/manifest-windows-x86_64.json <<EOF
          { "platform": "windows-x86_64", "signature": $(printf '%s' "$sig" | jq -Rs .), "url": "https://github.com/GitHubCJ123/Verbatim-AI/releases/download/${VERSION}/$(printf '%s' "$fname_url" | jq -sRr @uri)" }
          EOF
              cat > _updater/manifest-windows-x86_64-nsis.json <<EOF
          { "platform": "windows-x86_64-nsis", "signature": $(printf '%s' "$sig" | jq -Rs .), "url": "https://github.com/GitHubCJ123/Verbatim-AI/releases/download/${VERSION}/$(printf '%s' "$fname_url" | jq -sRr @uri)" }
          EOF
              echo "WROTE windows manifest fragment for $fname_url (orig $fname)"
            else
              echo "No windows signature/exe pair found; skipping."
            fi
          fi
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" ]; then
            sig_file=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz.sig" | head -n1 || true)
            tar_file=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" ! -name "*.sig" | head -n1 || true)
            if [ -n "$sig_file" ] && [ -n "$tar_file" ]; then
              sig=$(cat "$sig_file")
              fname=$(basename "$tar_file")
              # Same space->period normalization as on Windows.
              fname_url=$(printf '%s' "$fname" | tr ' ' '.')
              # Upload the tar + sig so the updater URL resolves.
              gh release upload "${VERSION}" "$tar_file" "$sig_file" --clobber --repo "${{ github.repository }}"
              cat > _updater/manifest-darwin-aarch64.json <<EOF
          { "platform": "darwin-aarch64", "signature": $(printf '%s' "$sig" | jq -Rs .), "url": "https://github.com/GitHubCJ123/Verbatim-AI/releases/download/${VERSION}/$(printf '%s' "$fname_url" | jq -sRr @uri)" }
          EOF
              echo "WROTE darwin manifest fragment for $fname_url (orig $fname)"
            else
              echo "No darwin signature/tar pair found; skipping."
            fi
          fi
          ls -la _updater || true

      - name: Upload manifest fragment
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.platform }}
          path: _updater/*.json
          if-no-files-found: warn
          retention-days: 1

  publish-latest-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Download fragments
        uses: actions/download-artifact@v4
        with:
          path: fragments
          pattern: updater-fragment-*
          merge-multiple: true

      - name: Download runtime fragments
        uses: actions/download-artifact@v4
        with:
          path: runtime-fragments
          pattern: runtime-fragment-*
          merge-multiple: true

      - name: Build merged latest.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          notes="See the release page for full notes."
          platforms='{}'
          for f in fragments/*.json; do
            entry=$(cat "$f")
            platform=$(printf '%s' "$entry" | jq -r .platform)
            payload=$(printf '%s' "$entry" | jq '{signature, url}')
            platforms=$(printf '%s' "$platforms" | jq --arg p "$platform" --argjson v "$payload" '. + {($p): $v}')
          done
          jq -n --arg v "$version" --arg d "$pub_date" --arg n "$notes" --argjson p "$platforms" \
            '{ version: $v, notes: $n, pub_date: $d, platforms: $p }' > latest.json
          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$VERSION" latest.json --clobber --repo "$REPOSITORY"

      - name: Build and upload signed Whisper runtime manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - runtime-fragments/*.json > whisper-runtimes.json <<'PY'
          import json, os, pathlib, sys
          assets = {}
          for name in sys.argv[1:]:
              fragment = json.loads(pathlib.Path(name).read_text())
              assets.update(fragment.get("assets", {}))
          if not assets:
              raise SystemExit("No Whisper runtime assets found in runtime fragments")
          print(json.dumps({"version": os.environ["VERSION"], "assets": assets}, indent=2, sort_keys=True))
          PY
          pnpm tauri signer sign whisper-runtimes.json > whisper-runtimes.json.sig
          gh release upload "$VERSION" whisper-runtimes.json whisper-runtimes.json.sig --clobber --repo "$REPOSITORY"

      # Auto-publish. This is the LAST step of the LAST job, and the whole job
      # only runs when `needs: build` (the full windows+macos matrix) succeeded,
      # so we only ever publish a complete, clean tagged build. Before flipping
      # the draft, sanity-check that the critical assets are actually present —
      # a corrupted/partial asset set (e.g. from a `--failed` matrix re-run)
      # then fails here and leaves the release as a draft instead of publishing
      # something the updater would choke on.
      - name: Publish release (mark latest)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          names=$(gh release view "$VERSION" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
          echo "Assets on $VERSION:"; echo "$names"
          require() {
            if ! printf '%s\n' "$names" | grep -qx "$1"; then
              echo "::error::Required asset '$1' missing — leaving release as draft."
              exit 1
            fi
          }
          # Updater manifest + macOS updater bundle (+sig).
          require "latest.json"
          require "Verbatim.AI.app.tar.gz"
          require "Verbatim.AI.app.tar.gz.sig"
          # Installers must exist (name embeds the version, so derive it).
          v="${VERSION#v}"
          require "Verbatim.AI_${v}_aarch64.dmg"
          require "Verbatim.AI_${v}_x64-setup.exe"
          require "Verbatim.AI_${v}_x64_en-US.msi"
          gh release edit "$VERSION" --repo "$REPOSITORY" --draft=false --latest
          echo "Published $VERSION as latest."
