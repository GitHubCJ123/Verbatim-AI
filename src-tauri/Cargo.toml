[package]
name = "verbatim-ai"
version = "0.3.3"
description = "Verbatim AI — voice transcription for Windows"
authors = ["Verbatim AI contributors"]
edition = "2021"

[lib]
name = "verbatim_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
enigo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local Whisper transcription via whisper.cpp sidecar binary.
# We download the official prebuilt whisper-cli executable + GGML model
# files into the app data dir, and shell out to it per transcription.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSRunLoop",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSResponder",
] }

