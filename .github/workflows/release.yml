name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Single source of truth for whisper.cpp version used by every release.
# Bump this when upgrading the bundled whisper runtime.
env:
  WHISPER_CPP_VERSION: v1.8.4

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ""
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & release (installers)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Verbatim AI ${{ github.ref_name }}"
          releaseBody: |
            ## Installers
            Pick the file for your platform below.

            ## Local Whisper runtime
            If you turn on **Local Whisper** in Settings → AI model, the app downloads the matching runtime zip from this release automatically. You don't need to grab it manually.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # --- Whisper runtime zips, attached to the same draft release ---

      - name: (Windows) Fetch whisper.cpp CUDA build
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/${{ env.WHISPER_CPP_VERSION }}/whisper-cublas-12.4.0-bin-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile whisper-bin-windows-x64.zip

      - name: (macOS) Build whisper.cpp with Metal
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.WHISPER_CPP_VERSION }}" \
            https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j$(sysctl -n hw.ncpu)

          mkdir -p dist
          cp whisper.cpp/build/bin/whisper-cli dist/
          find whisper.cpp/build -type f -name "*.dylib" -exec cp -n {} dist/ \;

          cd dist
          for dylib in *.dylib; do
            install_name_tool -id "@executable_path/$(basename "$dylib")" "$dylib" || true
          done
          for bin in whisper-cli *.dylib; do
            otool -L "$bin" | awk 'NR>1 {print $1}' | while read -r dep; do
              base=$(basename "$dep")
              if [ -f "$base" ] && [ "$dep" != "@executable_path/$base" ]; then
                install_name_tool -change "$dep" "@executable_path/$base" "$bin" || true
              fi
            done
          done
          zip -r ../whisper-bin-macos-arm64.zip .

      - name: Attach whisper runtime to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            whisper-bin-windows-x64.zip
            whisper-bin-macos-arm64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
